# 30-user-overlay.toml — the user-environment overlay (Dev Spec §5.3, D4a).
#
# The fourth state axis: the user's OWN environment — their MCP servers, their
# non-kit scripts, their discretionary dev tools. The kit ships an *extensible
# base* (PC-4), so adopters compose here without touching a kit release. Three
# mechanisms, by artifact type — enforced by mount_resolver.check_overlay_install:
#
#   compiled-binary -> in-container   (never symlinked across the libc boundary, R-10)
#   script / config -> symlink        (portable across the boundary)
#   mcp-fragment    -> additive       (composed with baked kit MCPs, never whole-file, R-09)
#   toolbox         -> in-container   (durable, materialized by a declarative manifest, R-11)

# --- Third-party / user MCP servers (R-09) -----------------------------------
# Composes ADDITIVELY with the kit's own MCP registrations (disc-server,
# sdlc-server, wtf-server, nerf-server, discord-watcher) which are BAKED at
# stable image paths — baking kills the dangling-registration bug (a stale path
# to a moved binary). We mount only an MCP *fragment*, never the whole
# ~/.claude.json (which carries far more than MCP config). See docs/mcp-scoping.md.
[[mount]]
name = "mcp-fragment"
layer = "user-overlay"
artifact = "mcp-fragment"
compose = "additive"
mode = "ro"
source = "~/.oaw/overlay/<major>/mcp.json"
target = "/home/ubuntu/.oaw/overlay/mcp.json"

# --- Discretionary dev-tool toolbox (R-11) -----------------------------------
# A declarative manifest (mise / apt-list) an in-container installer materializes
# into this durable dir. Decoupled from kit releases (updating ripgrep is not a
# kit release), reproducible on a fresh box, user-owned.
[[mount]]
name = "toolbox"
layer = "user-overlay"
artifact = "toolbox"
mode = "rw"
source = "~/.oaw/toolbox/<major>"
target = "/home/ubuntu/.oaw/toolbox"

# --- The operator's own utilities (#1089) ------------------------------------
# Mount ~/.local/bin DIRECTLY, read-only, mirroring the whole-dir secrets decision
# (#1090): the operator uses these constantly and curating which agent gets which
# utility is overhead that buys nothing. Measured: 139 files (113 scripts, 26 ELF).
#
# The staging-dir + classifier design this replaces (~/.oaw/overlay/<major>/local-bin,
# with mount_resolver.is_compiled_binary routing ELF in-container and shebangs by
# symlink) was declared, unit-tested, and NEVER WIRED — the source dir sat empty and
# nothing consumed it. Host ELF binaries simply run here (verified: lychee, ruff,
# rage). AppImages do not (no FUSE), which fails visibly at invocation.
#
# TARGET IS DELIBERATELY *NOT* /home/ubuntu/.local/bin. That is the KIT's bin — it
# holds the claude wrapper (#1076) and the MCP server binaries. Mounting over it
# would shadow the wrapper and silently un-bootstrap every agent. This lands beside
# it and is APPENDED to PATH (Dockerfile), so the kit wins every collision.
#
# ro: the container must not write into the operator's real bin.
[[mount]]
name = "user-local-bin"
layer = "user-overlay"
artifact = "script"
install = "symlink"
mode = "ro"
source = "~/.local/bin"
target = "/home/ubuntu/.oaw/overlay/local-bin"

# --- Operator skills overlay, the host-fill source (#1078) -------------------
# bootstrap's skills-sync has always had a host-fill path — for each host skill
# with no same-named image skill, symlink it in — and NOTHING EVER MOUNTED TO IT.
# It was invisible until #1076 made bootstrap actually run, at which point every
# agent boot emitted "missing mount: host skills overlay not present". A WARN on
# every single boot is how an operator learns that bootstrap output is noise,
# which is the same erosion as #1061's inert R-14 and #1056's zero manifests.
#
# DISTINCT FROM THE DEV-MODE OVERLAY, deliberately (architecture.md §2.1):
#   dev-mode  binds a working copy OVER /home/ubuntu/.claude/skills — REPLACES
#   host-fill lands beside it and only fills GAPS — image always wins a collision
# Two mechanisms answering different questions; this is the second one's mount.
#
# ro: the container reads these to symlink them in. It must never write into the
# operator's skill sources, and the image copy wins every name collision anyway.
[[mount]]
name = "skills-overlay"
layer = "user-overlay"
artifact = "script"
install = "symlink"
mode = "ro"
source = "~/.oaw/overlay/<major>/skills"
target = "/home/ubuntu/.oaw/.claude/skills"

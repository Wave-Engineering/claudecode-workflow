name: Validate

on:
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Tags are REQUIRED: scripts/ci/oaw-major.sh derives the kit major from
          # `git describe --tags` (#1067). Without them the derivation cannot resolve
          # in CI while passing locally — the classic green-here/red-there split.
          #
          # BOTH inputs are needed. fetch-depth: 0 does NOT imply tags in
          # actions/checkout@v4: fetch-tags is a separate input defaulting to false,
          # and the action fetches with --no-tags unless it is set. Verified from the
          # run log, which printed `fetch-tags: false` alongside `fetch-depth: 0`
          # while the derivation still failed.
          fetch-depth: 0
          fetch-tags: true

      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck

      - name: Install shfmt
        run: |
          GOBIN=/usr/local/bin go install mvdan.cc/sh/v3/cmd/shfmt@latest

      # Pinned release tarball, checksum-verified, hermetic — no piped
      # installer — mirrors containers/oakandwave-workflow/Dockerfile's own
      # trivy install (same TRIVY_VERSION; cc-workflow#1169 code review flagged
      # the two pins as duplicated with no drift guard — see the version-match
      # test in tests/test_dependency_scan.py). Without this step,
      # scripts/ci/dependency-scan.sh returns 3 (trivy not installed) on EVERY
      # PR, silently, and the checklist item this exists to gate has never
      # actually run in the lane CI runs (cc-workflow#1169 code review) — the
      # exact "config exists, config does not work" gap this fleet treats as
      # a defect class elsewhere. The checksum step guards transport
      # corruption/truncation, NOT a compromised release: checksums.txt is an
      # asset of the same mutable release fetched over the same channel, with
      # no signature check — anyone who could swap the tarball could swap the
      # checksums file too. Worth having regardless; not the stronger claim.
      - name: Install trivy
        env:
          TRIVY_VERSION: "0.72.0"
        run: |
          # Downloaded AS the exact name checksums.txt's line names — sha256sum -c
          # resolves the file to check from the checksum LINE's filename, not from
          # the path curl wrote it to. A mismatched local name (e.g. trivy.tar.gz)
          # makes sha256sum -c look for a file that was never created and fail
          # every run, deterministically (caught by review before this shipped:
          # a standalone test of this exact command passed only because it
          # happened to copy the file under checksums.txt's name first, which
          # this step does not do).
          asset="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -fsSL "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/${asset}" -o "/tmp/${asset}"
          curl -fsSL "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_checksums.txt" -o /tmp/trivy_checksums.txt
          # Anchored to end-of-line so a version bump can't match a sibling
          # asset (.sbom.json, .sig) and silently turn this into a multi-line
          # (and therefore always-failing) check.
          grep -E "  ${asset}\$" /tmp/trivy_checksums.txt | (cd /tmp && sha256sum -c -)
          tar -C /tmp -xzf "/tmp/${asset}" trivy
          sudo install -m 0755 /tmp/trivy /usr/local/bin/trivy
          rm -f "/tmp/${asset}" /tmp/trivy /tmp/trivy_checksums.txt

      # Caches trivy's vulnerability DB so a repeated push/re-run on the SAME
      # PR isn't blocked by a cold, unauthenticated ghcr.io pull every time —
      # dependency-scan.sh's own timeout/no-output handling (rc=5) already
      # anticipates this pull failing (first run, rate-limited, air-gapped);
      # this reduces how often that path is hit for a reason unrelated to the
      # PR's actual code.
      #
      # Honest limit (cc-workflow#1169 code review): GitHub scopes a
      # pull_request-triggered cache to that PR's merge ref — it cannot be
      # read by a DIFFERENT PR or by main, and no OTHER workflow here writes
      # a trivy-db-* entry to prime main's scope. So `restore-keys` can only
      # ever warm-start a later run of the SAME PR; every new PR's first run
      # is still cold. Not a no-op (multi-push PRs benefit), but narrower
      # than "warm start" implies on first read.
      - name: Cache trivy vulnerability DB
        uses: actions/cache@v4
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ github.run_id }}
          restore-keys: |
            trivy-db-

      - name: Run validation
        run: ./scripts/ci/validate.sh

      - name: Compat-guard — block a silent same-major schema break (#1002)
        run: |
          # NO --depth=1 and NO --no-tags. A shallow fetch does not merely fetch
          # less — it marks the whole repository shallow (.git/shallow), and that
          # persists for every LATER step in the job. It silently un-did checkout's
          # fetch-depth: 0 + fetch-tags: true, so `git describe --tags` in the test
          # step could no longer walk history and scripts/ci/oaw-major.sh refused
          # (#1067). checkout already fetched full history here, so this costs
          # nothing extra and leaves the repo intact for what runs after it.
          git fetch origin main:refs/remotes/origin/main
          COMPAT_GUARD_BASE_REF=origin/main ./scripts/ci/compat-guard.sh

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: pip install pytest pytest-cov

      - name: Run test suite (cc-workflow#795 — gate the pytest suite)
        env:
          # DM-05/DM-06 (Story 2.1, #966): emit JUnit + coverage into reports/.
          CC_TEST_REPORTS_DIR: reports
        run: ./scripts/ci/test.sh

      # Coverage is a COMPLETENESS SIGNAL, uploaded regardless of the test gate
      # (if: always()) — a red suite still publishes its reports (R-06, DM-06).
      - name: Upload JUnit + coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            reports/junit.xml
            reports/coverage.xml
          if-no-files-found: warn

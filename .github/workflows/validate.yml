name: Validate

on:
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Tags are REQUIRED: scripts/ci/oaw-major.sh derives the kit major from
          # `git describe --tags` (#1067). Without them the derivation cannot resolve
          # in CI while passing locally — the classic green-here/red-there split.
          #
          # BOTH inputs are needed. fetch-depth: 0 does NOT imply tags in
          # actions/checkout@v4: fetch-tags is a separate input defaulting to false,
          # and the action fetches with --no-tags unless it is set. Verified from the
          # run log, which printed `fetch-tags: false` alongside `fetch-depth: 0`
          # while the derivation still failed.
          fetch-depth: 0
          fetch-tags: true

      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck

      - name: Install shfmt
        run: |
          GOBIN=/usr/local/bin go install mvdan.cc/sh/v3/cmd/shfmt@latest

      # Pinned release tarball, hermetic — no piped installer — mirrors
      # containers/oakandwave-workflow/Dockerfile's own trivy install.
      # Without this, scripts/ci/dependency-scan.sh returns 3 (trivy not
      # installed) on EVERY PR, silently, and the checklist item this exists
      # to gate has never actually run in the lane CI runs (cc-workflow#1169
      # code review) — the exact "config exists, config does not work" gap
      # this fleet treats as a defect class elsewhere.
      - name: Install trivy
        env:
          TRIVY_VERSION: "0.72.0"
        run: |
          curl -fsSL "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" -o /tmp/trivy.tar.gz
          tar -C /tmp -xzf /tmp/trivy.tar.gz trivy
          sudo install -m 0755 /tmp/trivy /usr/local/bin/trivy
          rm -f /tmp/trivy.tar.gz /tmp/trivy

      - name: Run validation
        run: ./scripts/ci/validate.sh

      - name: Compat-guard — block a silent same-major schema break (#1002)
        run: |
          # NO --depth=1 and NO --no-tags. A shallow fetch does not merely fetch
          # less — it marks the whole repository shallow (.git/shallow), and that
          # persists for every LATER step in the job. It silently un-did checkout's
          # fetch-depth: 0 + fetch-tags: true, so `git describe --tags` in the test
          # step could no longer walk history and scripts/ci/oaw-major.sh refused
          # (#1067). checkout already fetched full history here, so this costs
          # nothing extra and leaves the repo intact for what runs after it.
          git fetch origin main:refs/remotes/origin/main
          COMPAT_GUARD_BASE_REF=origin/main ./scripts/ci/compat-guard.sh

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: pip install pytest pytest-cov

      - name: Run test suite (cc-workflow#795 — gate the pytest suite)
        env:
          # DM-05/DM-06 (Story 2.1, #966): emit JUnit + coverage into reports/.
          CC_TEST_REPORTS_DIR: reports
        run: ./scripts/ci/test.sh

      # Coverage is a COMPLETENESS SIGNAL, uploaded regardless of the test gate
      # (if: always()) — a red suite still publishes its reports (R-06, DM-06).
      - name: Upload JUnit + coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            reports/junit.xml
            reports/coverage.xml
          if-no-files-found: warn

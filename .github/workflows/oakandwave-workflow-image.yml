# oakandwave-workflow image — the Build stage of the contained-workflow pipeline
# (DM-03, Story 2.1 / #966, Dev Spec §5.B).
#
#   build -> push to ghcr -> cosign sign -> syft SBOM -> stamp OCI labels
#
# The image *digest is the release* (R-05): everything versioned-with-the-release
# is baked in, and CI stamps the provenance (semver / source / revision /
# timestamp) plus a keyless cosign signature and a syft SBOM bound to the digest
# (R-24). The throwaway-CI ring (Story 2.2, E2E-01) pulls that digest and verifies
# labels/permissions/signature/SBOM before smoke — the digest tested is the digest
# promoted (R-23).
#
# All build/sign logic lives in scripts/ci/*.sh (project rule: No Procedural Logic
# in CI/CD YAML); the steps below only wire installer actions to those scripts.
#
# TRIGGER: a candidate is cut DELIBERATELY, not on every merge (#1063).
#
# This used to include `push: branches: [main]`. Every merge — docs-only ones
# included — ran build -> cosign -> syft -> GHCR push against a ~9.9 GB base.
# Measured on a markdown-only merge (cc57a75, PR #1060): 1049 s / 17.5 min. Two
# costs, and the first is the expensive one:
#
#   1. THROUGHPUT. /scpmmr waits on the main-branch pipeline, so every agent in
#      the fleet paid ~17.5 min per merge — the inner loop for every kit change.
#   2. REGISTRY CLUTTER. Every merge since this workflow landed minted an :edge
#      that nothing would ever pull.
#
# NOT a `paths:` filter, deliberately. The kit is BAKED into the image, so
# `skills/**` and `scripts/**` genuinely do change it — a filter would either be
# so broad it saved little, or would silently ship a stale :stable. "Did we
# decide to release?" is the correct axis, not "which files moved".
#
# The bless-and-promote path already existed end to end and is untouched:
# scripts/ci/promote-oakandwave-image.sh retags the EXACT digest :edge -> :stable
# with no rebuild (same bytes, R-23), and the mirror workflow only ever mirrors an
# already-promoted :stable. The only defect was minting candidates on merge rather
# than on a release decision — which also matches R-05 ("the image digest IS the
# release") more honestly than minting a release artifact for a typo fix.
#
# Merging to main is NOT a release. See docs/operations/image-release-cadence.md.
# It does NOT run on the kahuna integration branches either, so a wave never
# triggers a heavy push to ghcr.
name: oakandwave-workflow image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write # keyless cosign (Fulcio/Rekor) via OIDC

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # GHCR path MUST be lowercase — the org login "Wave-Engineering" carries capitals,
      # and `${{ github.repository_owner }}` would interpolate them into the image path
      # (the Docker client + GHCR reject uppercase repo names). Hardcoded lowercase here,
      # matching flightdeck and the sibling scripts; scripts/ci/lowercase-image-guard.sh
      # fails CI if a capitalized (or raw repository_owner) image ref is ever reintroduced.
      IMAGE: ghcr.io/wave-engineering/oakandwave-workflow
      TAG: edge
    # Expose the pushed digest so the throwaway-CI ring (smoke) pulls the exact
    # bytes this job built + signed — the digest tested is the digest promoted
    # (R-23), never a moving tag.
    outputs:
      digest_ref: ${{ steps.build.outputs.digest_ref }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # AOE_PULL_TOKEN (if provisioned) authenticates the cross-org base-image
      # pull from ghcr.io/agent-of-empires; GITHUB_TOKEN pushes to this org.
      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.AOE_PULL_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@v3
        with:
          # Pinned to cosign v2.x: the SBOM attestation skips the public rekor
          # tlog (its predicate exceeds rekor's body ceiling for this ~10 GB
          # image, failing every run — #995) and uses an RFC3161 TSA instead.
          # cosign v3 dropped the --tlog-upload lever for the declarative
          # signing-config model; migrating to that is a follow-up.
          cosign-release: 'v2.6.4'

      - name: Install syft
        uses: anchore/sbom-action/download-syft@v0

      - name: Build, label, and push the image
        id: build
        env:
          OAKANDWAVE_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          # Tag-triggered builds ALSO publish the version tag, at the same digest
          # (#1122). Until this, a release left no trace in the registry — only
          # `:edge` was ever pushed — so retention had no anchor and rollback
          # meant reading OCI labels off candidate digests one at a time.
          #
          # workflow_dispatch deliberately gets no version tag: a manual build is
          # a CANDIDATE, not a release, and #1063's whole point is that those are
          # different acts.
          EXTRA_TAGS: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: ./scripts/ci/build-oakandwave-image.sh

      - name: Sign (cosign) + SBOM (syft) the digest
        env:
          DIGEST_REF: ${{ steps.build.outputs.digest_ref }}
        run: ./scripts/ci/sign-oakandwave-image.sh

  # Throwaway-CI ring (Story 2.2, E2E-01 — Dev Spec §6.3, R-05/R-23/R-24). Pulls
  # the candidate BY DIGEST from ghcr, verifies labels/permissions/signature/SBOM,
  # installs from zero, runs the smoke suite, tears down. A red smoke — or any
  # failed provenance check — fails this job and blocks the digest from promotion.
  # It never rebuilds locally: the digest tested is the digest the build job
  # pushed and signed (R-23).
  smoke:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read # pull the candidate digest from ghcr
    steps:
      - uses: actions/checkout@v4 # the ring script + the smoke suite

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@v3
        with:
          # Pinned to cosign v2.x: the SBOM attestation skips the public rekor
          # tlog (its predicate exceeds rekor's body ceiling for this ~10 GB
          # image, failing every run — #995) and uses an RFC3161 TSA instead.
          # cosign v3 dropped the --tlog-upload lever for the declarative
          # signing-config model; migrating to that is a follow-up.
          cosign-release: 'v2.6.4'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install smoke-suite dependencies
        run: pip install pytest

      - name: Throwaway-CI ring — verify provenance, install-from-zero, smoke
        env:
          DIGEST_REF: ${{ needs.build.outputs.digest_ref }}
        run: ./scripts/ci/throwaway-ci-ring.sh
